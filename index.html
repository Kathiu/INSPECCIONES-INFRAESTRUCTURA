<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b57d0"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css"><title>Inspecciones de Infraestructura</title></head><body><header><div><h1>Inspecciones de Infraestructura</h1><small id="net">Iniciando…</small></div></header><main>
<section class="card"><h2>Nueva inspección</h2><div class="grid"><label>Mes<select id="month"></select></label><label>Zona / Área<select id="zone"></select></label><label>Punto de inspección<select id="point" disabled></select></label><label>Resultado<select id="result"><option>SIN INCIDENCIA</option><option>CON INCIDENCIA</option></select></label><label>Estado<select id="status"><option>REPORTADO</option><option>PENDIENTE</option></select></label></div><label>Observación<textarea id="obs" rows="3" placeholder="Describa la incidencia o indique lo observado"></textarea></label><div class="photoBar"><div><b>Fotografías del punto</b><small id="photoCount">0/12</small></div><button id="camera" class="primary">📷 Tomar fotografía</button></div><input id="cameraInput" type="file" accept="image/*" capture="environment" hidden><div id="photos" class="photos"></div><div class="actions"><button id="clear" class="danger">Borrar</button><button id="save" class="primary">Guardar inspección</button></div></section>
<section class="card"><h2>Reporte mensual</h2><div class="grid"><label>Mes<select id="reportMonth"></select></label><label>Año<input id="reportYear" type="number"></label></div><button id="report" class="primary full">📄 Generar reporte mensual</button><small>Incluye todas las áreas, puntos, fechas, observaciones, estados y fotografías del mes seleccionado.</small></section>
<section class="card"><h2>Últimas inspecciones</h2><div id="records"></div></section></main><script src="app.js"></script></body></html>
